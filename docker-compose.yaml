services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: naaktkat-backend
        ports:
            - "1232:8080"
        env_file:
            - ./backend/.env
        environment:
            - PORT=8080
        restart: unless-stopped
        tty: true
        healthcheck:
            test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s